<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVI.com - Presupuesto</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html">PVI.com</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto text-uppercase">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="destinos.html">Destinos</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="presupuesto.html">Presupuesto</a></li>
          <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="desarrolladores.html">Desarrolladores</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="py-5 bg-light">
    <div class="container">
      
      <!-- SECCIÓN 1: ¿TIENES UN PRESUPUESTO? -->
      <section class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-5 bg-white">
        <h2 class="h3 fw-bold text-navy mb-2">¿Tienes un presupuesto?</h2>
        <p class="text-secondary mb-4">Dinos tu presupuesto y te recomendamos las mejores opciones</p>
        
        <div class="row g-3 align-items-center">
          <div class="col-12 col-md-6 col-lg-5">
            <input type="number" class="form-control form-control-lg rounded-pill px-4" placeholder="Escribe tu presupuesto ($)...">
          </div>
          <div class="col-12 col-md-3 col-lg-3">
            <select class="form-select form-select-lg rounded-pill">
              <option selected>Nacional</option>
              <option value="1">Internacional</option>
            </select>
          </div>
          <div class="col-12 col-md-3 col-lg-4">
            <button class="btn btn-info text-navy fw-bold btn-lg rounded-pill w-100" type="button">BUSCAR DESTINO</button>
          </div>
        </div>
      </section>

      <!-- SECCIÓN 2: O TE AYUDAMOS A CREARLO -->
      <section class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <h3 class="h4 fw-bold text-navy mb-4">O te ayudamos a crearlo</h3>

        <form>
          <!-- Opciones de tipo de viaje (Radio Buttons) -->
          <div class="d-flex gap-4 mb-4">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tripType" id="roundTrip" checked>
              <label class="form-check-label fw-semibold" for="roundTrip">
                Ida y vuelta
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tripType" id="oneWay">
              <label class="form-check-label fw-semibold" for="oneWay">
                Solo ida
              </label>
            </div>
          </div>

          <!-- Campos Origen y Destino -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold text-secondary">Origen</label>
              <input type="text" class="form-control form-control-lg rounded-3" value="San Salvador, El Salvador">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold text-secondary">Destino</label>
              <input type="text" class="form-control form-control-lg rounded-3" placeholder="Escribe destino...">
            </div>
          </div>

          <!-- Campos Fechas y Pasajeros -->
          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold text-secondary">Salida</label>
              <input type="date" class="form-control form-control-lg rounded-3">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold text-secondary">Regreso</label>
              <input type="date" class="form-control form-control-lg rounded-3">
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold text-secondary">Pasajeros</label>
              <div class="input-group input-group-lg">
                <input type="number" class="form-control rounded-3" value="1" min="1">
              </div>
            </div>
          </div>

          <!-- Botón Generar/Crear -->
          <div class="text-end">
            <button type="submit" class="btn btn-navy text-white fw-bold btn-lg rounded-pill px-5">Crear Presupuesto</button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-navy text-white py-4 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">Síguenos</span>
        <a href="#" class="text-white fs-5"><i class="fa-brands fa-facebook"></i></a>
        <a href="#" class="text-white fs-5"><i class="fa-brands fa-linkedin"></i></a>
      </div>
      <div>
        <a href="#" class="text-white text-decoration-none fw-semibold">Ir al inicio <i class="fa-solid fa-arrow-up ms-1"></i></a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
