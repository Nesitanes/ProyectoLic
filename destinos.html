<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVI - Destinos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="destinos.html">DESTINOS</a>
            <a href="presupuesto.html">PRESUPUESTO</a>
            <a href="favoritos.html">FAVORITOS</a>
            <a href="contacto.html">CONTACTO</a>
            <a href="#" id="open-flights-cart" style="font-weight: bold; color: #b3d9ff;"> VUELOS (<span id="cart-counter">0</span>)</a>
            </nav>
    </header>

    <div class="hero-banner" style="height: 200px;">
        <div class="search-box">
            <input type="text" id="country-input" placeholder="Escribe el nombre de un país (ej. El Salvador)...">
            <button id="country-search-btn">BUSCAR DESTINO</button>
        </div>
    </div>

    <main>
        <div class="destinos-layout">
            <!-- Lado Izquierdo: Información del País y Clima -->
            <section>
                <div class="info-card">
                    <h2 id="country-name">Busca un país</h2>
                    <p><strong>Capital:</strong> <span id="country-capital">-</span></p>
                    <p><strong>Moneda:</strong> <span id="country-currency">-</span></p>
                    <p><strong>Superficie:</strong> <span id="country-area">-</span></p>
                    <p><strong>Idioma:</strong> <span id="country-language">-</span></p>
                    <p><strong>Bandera:</strong></p>
                    <img id="country-flag" src="" alt="Bandera" style="width: 100px; display: none; margin-top: 5px; border: 1px solid #ccc;">
                </div>

                <div class="weather-card">
                    <h3>Clima Hoy</h3>
                    <div id="weather-desc"><p>Realiza una búsqueda para ver el clima.</p></div>
                </div>
            </section>

            <!-- Lado Derecho: Lugares Turísticos -->
            <section>
                <h2>Lugares turísticos que visitar</h2>
                <div class="cards-grid" id="tourist-places-container">
                    <p>Usa el buscador superior para explorar atractivos.</p>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>Síguenos</p>
        <div class="social-icons">
            <a href="#">f</a><a href="#">📷</a><a href="#">🐦</a><a href="#">▶</a><a href="#">in</a>
        </div>
        <button class="scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">Ir al inicio ↑</button>
    </footer>
    <script src="js/paises-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
